name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  PROJECT_NAME: OStimNPCs

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup C++ environment
        uses: aminya/setup-cpp@v1
        with:
          compiler: msvc
          vcvarsall: true
          setup-cpp: false
          powershell: true

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: '.xmake-cache'

      - name: Extract version from xmake.lua
        id: version
        shell: powershell
        run: |
          $version = (Select-String -Path "xmake.lua" -Pattern 'set_version\("([^"]+)"\)').Matches[0].Groups[1].Value
          echo "PROJECT_VERSION=$version" >> $env:GITHUB_ENV
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build releasedbg
        run: xmake -y ${{ env.PROJECT_NAME }}

      - name: Assemble mod package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "contrib/Package"
          $sksePlugins = Join-Path $stage "SKSE/Plugins"

          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # 1. The repository root mirrors the Data folder. Only the mod's own files are packaged
          #    (Source/SKSE, the C++ source, is deliberately left out).
          $esp = "${{ env.PROJECT_NAME }}.esp"
          if (-not (Test-Path $esp)) { throw "$esp not found in the repository root" }
          Copy-Item -Path $esp -Destination $stage -Force
          Copy-Item -Path "Interface" -Destination $stage -Recurse -Force

          New-Item -ItemType Directory -Force -Path (Join-Path $stage "Scripts") | Out-Null
          Copy-Item -Path "Scripts/*.pex" -Destination (Join-Path $stage "Scripts") -Force -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path (Join-Path $stage "Source/Scripts") | Out-Null
          Copy-Item -Path "Source/Scripts/*.psc" -Destination (Join-Path $stage "Source/Scripts") -Force

          # 2. Sanity check: compiled scripts are tracked, so make sure they are actually there
          $pex = Get-ChildItem -Path (Join-Path $stage "Scripts") -Filter *.pex -ErrorAction SilentlyContinue
          if (-not $pex) { throw "No .pex files found in Scripts - compiled scripts must be committed" }

          # Every Papyrus source must have a compiled counterpart (CI can't compile, so a forgotten
          # recompile has to be caught here). Checks existence only, not whether the .pex is up to date.
          $psc = Get-ChildItem -Path (Join-Path $stage "Source/Scripts") -Filter *.psc -ErrorAction SilentlyContinue
          $missing = @($psc | Where-Object { -not (Test-Path (Join-Path $stage "Scripts/$($_.BaseName).pex")) } |
                       ForEach-Object { $_.Name })
          if ($missing.Count -gt 0) {
            throw "Missing compiled .pex for: $($missing -join ', '). Run 'xmake papyrus' and commit Scripts."
          }

          # 3. DLL + PDB from the xmake build go into SKSE/Plugins
          New-Item -ItemType Directory -Force -Path $sksePlugins | Out-Null
          foreach ($name in "${{ env.PROJECT_NAME }}.dll", "${{ env.PROJECT_NAME }}.pdb") {
            $file = Get-ChildItem -Path "build" -Recurse -Filter $name -File |
                    Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $file) { throw "$name was not produced by the build" }
            Copy-Item $file.FullName -Destination $sksePlugins -Force
            Write-Host "Packaged $($file.FullName)"
          }

          # 4. Drop placeholder files that shouldn't ship
          Get-ChildItem -Path $stage -Recurse -Force -Include ".gitkeep", ".gitignore" | Remove-Item -Force

          Write-Host "Package contents:"
          Get-ChildItem -Path $stage -Recurse -File | ForEach-Object { $_.FullName.Substring((Resolve-Path $stage).Path.Length + 1) }

      - name: Create zip archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "contrib/Artifact" | Out-Null
          $zip = Join-Path "${{ github.workspace }}" "contrib/Artifact/${{ env.PROJECT_NAME }}_${{ env.PROJECT_VERSION }}.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }

          # .NET zip (built into PowerShell 7 on the runner). The package contents become
          # the zip root, and entries use forward slashes, which MO2/Vortex/Nexus all expect.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            (Resolve-Path "contrib/Package").Path,
            $zip,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $false)

          Write-Host "Created $zip ($([math]::Round((Get-Item $zip).Length / 1KB)) KB)"

      - name: Deploy Artifact
        uses: actions/upload-artifact@v4.3.3
        with:
          name: ${{ env.PROJECT_NAME }}_${{ env.PROJECT_VERSION }}
          path: ${{ github.workspace }}/contrib/Package/
          compression-level: '9'

      - name: Upload files to a GitHub release
        if: github.event_name == 'push'
        uses: ncipollo/release-action@v1.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: ${{ github.workspace }}/contrib/Artifact/${{ env.PROJECT_NAME }}_${{ env.PROJECT_VERSION }}.zip
          tag: ${{ env.PROJECT_VERSION }}
          commit: master
          generateReleaseNotes: true
          artifactErrorsFailBuild: true
          makeLatest: "latest"
          name: OStim NPCs ${{ env.PROJECT_VERSION }}
